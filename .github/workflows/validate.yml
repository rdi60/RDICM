name: Validate Rajan Dental
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund
      - name: Build React application
        working-directory: frontend
        run: npm run build
      - name: Create local-testing source ZIP
        run: git archive --format=zip --output=rajan_dental_neumorphism_local.zip HEAD
      - name: Upload local-testing source ZIP
        uses: actions/upload-artifact@v4
        with:
          name: rajan-dental-neumorphism-local
          path: rajan_dental_neumorphism_local.zip
          if-no-files-found: error
          retention-days: 30
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Test approved billing workflows
        working-directory: backend
        run: |
          python test_v02_approved.py
          python test_v03_ui_finance.py
          python test_v04_admin_templates.py
          python test_patient_intake_local.py
          python test_v07.py
          python test_flexible_overlap_booking.py
          python test_doctor_recurrence_local.py
          python test_appointment_calendar_local.py
          python test_patient_intake_local.py
